[tox]
envlist =
    py{313,314}{,-test}{,-cov}
    py{313,314,315}-devdeps{,-cov}
    build_docs
    linkcheck
    codestyle
    cov_report
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
isolated_build = true

[testenv]
usedevelop = True

# Pass through the following environemnt variables which may be needed for the CI
passenv = HOME,WINDIR,LC_ALL,LC_CTYPE,CC,CI

# Run the tests in a temporary directory to make sure that we don't import
# astropy from the source tree
changedir = {toxworkdir}/tox_testing

# The tests run in a temporary directory, but the CI workflow requires the
# coverage data to land at the root of the checkout in order to upload it.
# devdeps pulls nightly wheels of the core dependencies from these indexes.
set_env =
    cov: COVERAGE_FILE={toxinidir}/.coverage
    devdeps: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/liberfa/simple https://pypi.anaconda.org/scientific-python-nightly-wheels/simple

# tox environments are constructued with so-called 'factors' (or terms)
# separated by hyphens, e.g. test-devdeps-cov. Lines below starting with factor:
# will only take effect if that factor is included in the environment name. To
# see a list of example environments that can be run, along with a description,
# run:
#
#     tox -l -v
#
description =
    test: run tests
    cov: with coverage enabled
    devdeps: with nightly wheels of core dependencies
    cov_report: generate HTML coverage report

deps =
    devdeps: numpy>=0.0.dev0
    devdeps: astropy>=0.0.dev0
    devdeps: scipy>=0.0.dev0
    devdeps: matplotlib>=0.0.dev0
    devdeps: scikit-image>=0.0.dev0
    # poppy 1.1.2 imports the scipy.ndimage.interpolation namespace that scipy 2.0
    # removed. The fix is on poppy's develop branch but unreleased, so test devdeps
    # against poppy's development version as well.
    devdeps: poppy @ git+https://github.com/spacetelescope/poppy.git@develop

# need to have run tests before making coverage report
depends =
    cov_report: test

# The following indicates which extras_require from setup.cfg will be installed
extras =
    test

commands =
    pip freeze
    !cov: pytest --pyargs wfssrv {toxinidir}/docs {posargs}
    cov: pytest --pyargs wfssrv {toxinidir}/docs --cov wfssrv --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

[testenv:build_docs]
changedir = docs
description = invoke sphinx-build to build the HTML docs
extras =
    docs
commands =
    pip freeze
    sphinx-build -W -b html . _build/html

[testenv:linkcheck]
changedir = docs
description = check the links in the HTML docs
extras =
    docs
commands =
    pip freeze
    sphinx-build -W -b linkcheck . _build/html

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g. with flake8
deps = flake8
commands = flake8 wfssrv --count --max-line-length=135

[testenv:cov_report]
changedir = {toxworkdir}/tox_testing
deps = coverage
skip_install = true
commands =
  coverage html -d {toxinidir}/htmlcov

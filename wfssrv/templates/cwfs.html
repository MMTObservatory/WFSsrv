<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="{{ static_url("css/page.css") }}" type="text/css">
        <link rel="stylesheet" href="{{ static_url("css/bootstrap.min.css") }}" type="text/css">

        <style type="text/css">
            body {
              padding-top: 70px;
              padding-bottom: 30px;
            }
            .form-check label {
                margin-left: 10px;
            }
            .row {
                margin-top: 20px;
            }
        </style>

        <script src="{{ static_url("js/bootstrap.bundle.min.js") }}"></script>
        <script src="{{ static_url("js/plotly-latest.min.js") }}"></script>
        <script src="/mpl.js"></script>

        <script>
            /* This is a callback that is called when the user saves
             (downloads) a file.  Its purpose is really to map from a
             figure and file format to a url in the application. */
            {% for figure in figures %}
                function ondownload_{{ figure }}(figure, format) {
                    window.open('download_{{ figure }}.' + format, '_blank');
                };
            {% end %}
            function getZerns() {
                fetch("zfit?format=json").then(r => r.json()).then(function(data) {
                    document.getElementById('zernikes').textContent = data;
                });
            };
            document.addEventListener('DOMContentLoaded', function() {
                /* It is up to the application to provide a websocket that the figure
                 will use to communicate to the server.  This websocket object can
                 also be a "fake" websocket that underneath multiplexes messages
                 from multiple figures, if necessary. */
                var websocket_type = mpl.get_websocket_type();

                {% for ws_uri, fig_id, figure in zip(ws_uris, fig_ids, figures) %}
                    var websocket_{{ figure }} = new websocket_type("{{ ws_uri }}");

                    // mpl.figure creates a new figure on the webpage.
                    var fig = new mpl.figure(
                        // A unique numeric identifier for the figure
                        {{ fig_id }},
                        // A websocket object (or something that behaves like one)
                        websocket_{{ figure }},
                        // A function called when a file type is selected for download
                        ondownload_{{ figure }},
                        // The HTML element in which to place the figure
                        document.getElementById('{{ figure }}'),
                    );
                {% end %}

                getZerns();

                /* populate file datalists */
                fetch('files').then(r => r.json()).then(function(files) {
                    var opts = files.map(f => '<option value="' + f + '">').join('');
                    document.getElementById('file-suggestions-1').innerHTML = opts;
                    document.getElementById('file-suggestions-2').innerHTML = opts;
                });

                /* set up websocket for log streaming */
                var logDiv = document.getElementById('log');
                var log_ws = new WebSocket('{{ log_uri }}');
                log_ws.onopen = function() {
                    logDiv.insertAdjacentHTML('beforeend', "<span class='text-primary'>Logging started...</span><br/>");
                };
                log_ws.onmessage = function(ev) {
                    logDiv.insertAdjacentHTML('beforeend', ev.data);
                    logDiv.scrollTop = logDiv.scrollHeight;
                };
                log_ws.onclose = function(ev) {
                    logDiv.insertAdjacentHTML('beforeend', "<span class='text-primary'>Logging closed...</span><br/>");
                };
                log_ws.onerror = function(ev) {
                    logDiv.insertAdjacentHTML('beforeend', "<b><span class='text-danger'>Logging error!!!</span><br/>");
                };
            });
        </script>

        <title>Binospec Curvature Wavefront Sensing</title>
    </head>

    <body>
        <h1 class="text-center">Binospec Curvature Wavefront Sensing</h1>

        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="/">Home</a>
        </nav>

        <div class="container">
            <form>
                <div class="row g-2 mb-3">
                    <div class='col-md-12'>
                        <label for="datafile1"><b>FITS files to analyze:</b></label>
                        <div class="input-group">
                            <div class="input-group-text" id="datadir">{{ datadir }}</div>
                            <input type="text" class="form-control" id="datafile1" list="file-suggestions-1" aria-describedby="datadir">
                            <datalist id="file-suggestions-1"></datalist>
                            <input type="text" class="form-control" id="datafile2" list="file-suggestions-2" aria-describedby="datadir">
                            <datalist id="file-suggestions-2"></datalist>
                            <button class="btn btn-primary" id='analyze' type="button">Analyze</button>
                            <button class="btn btn-primary" id='latest' type="button">Analyse Latest</button>
                        </div>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class='col-auto'>
                        <div class="form-check form-check-inline">
                            <input id="connect" type="checkbox" class="form-check-input" checked>
                            <label class="form-check-label" for="connect">Enable Corrections</label>
                        </div>
                    </div>
                    <div class='col-auto'>
                        <div class="form-check form-check-inline">
                            <input id="spher" type="checkbox" class="form-check-input">
                            <label class="form-check-label" for="spher">Ignore Spherical</label>
                        </div>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class='col-auto'>
                        <div class="input-group">
                            <div class="input-group-text" id='m1label'>M1 Gain:</div>
                            <input type="number" min=0.0 max=1.0 step=0.1 value="{{ m1_gain }}" id="m1gain" class="form-control" aria-describedby="m1label">
                        </div>
                    </div>
                    <div class='col-auto'>
                        <div class="input-group">
                            <div class="input-group-text" id='m2label'>M2 Gain:</div>
                            <input type="number" min=0.0 max=1.0 step=0.1 value="{{ m2_gain }}" id="m2gain" class="form-control" aria-describedby="m2label">
                        </div>
                    </div>
                    <div class='col-auto'>
                        <button type="button" id='setgains' class="btn btn-primary">Set Gains</button>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class='col-auto'>
                        <button type="button" id='focuscorrect' disabled="disabled" class="btn btn-primary">Correct Focus</button>
                    </div>
                    <div class='col-auto'>
                        <button type="button" id='comacorrect' disabled="disabled" class="btn btn-primary">Correct Coma</button>
                    </div>
                    <div class='col-auto'>
                        <button type="button" id='m1correct' disabled="disabled" class="btn btn-primary">Correct M1</button>
                    </div>
                    <div class='col-auto'>
                        <button type="button" id='recenter' disabled="disabled" class="btn btn-primary">Recenter</button>
                    </div>
                    <div class='col-auto' style="margin-left: 100px">
                        <button type="button" id='clearm1' class="btn btn-danger">Clear M1</button>
                    </div>
                    <div class='col-auto' style="margin-left: 100px">
                        <button type="button" id='clearm2' class="btn btn-danger">Clear M2</button>
                    </div>
                    <div class='col-auto' style="margin-left: 100px">
                        <button type="button" id='clear' class="btn btn-danger">Clear All</button>
                    </div>
                </div>
            </form>
        </div>

        <script>
        var running = false;
        var orig_m1g = 0.5;
        var orig_m2g = 1.0;
        var continuous = false;
        var timer = undefined;
        var ready = false;
        var latest_file = "";
        var skip_next = false;

        var controlButtons = ["m1correct", "focuscorrect", "comacorrect", "clearm1", "clearm2", "clear", "analyze", "latest"];
        function enable() {
            controlButtons.forEach(function(id) {
                document.getElementById(id).disabled = false;
            });
        }
        function disable() {
            controlButtons.forEach(function(id) {
                document.getElementById(id).disabled = true;
            });
        }
        function activate(id) {
            // buttons get disabled so the operator can't click them mid-loop, but
            // continuous mode still has to drive them. a native .click() is a no-op
            // on a disabled control, so dispatch the event directly.
            document.getElementById(id).dispatchEvent(new MouseEvent("click", {bubbles: true}));
        }

        document.getElementById('focuscorrect').addEventListener('click', function() {
            fetch("focuscorrect").then(r => r.text()).then(function(data) {
                document.getElementById('focuscorrect').disabled = true;
                if (continuous == false) { alert(data); }
            });
        });
        document.getElementById('comacorrect').addEventListener('click', function() {
            fetch("comacorrect").then(r => r.text()).then(function(data) {
                document.getElementById('comacorrect').disabled = true;
                if (continuous == false) { alert(data); }
            });
        });
        document.getElementById('m1correct').addEventListener('click', function() {
            fetch("m1correct").then(r => r.text()).then(function(data) {
                document.getElementById('m1correct').disabled = true;
                if (continuous == false) { alert(data); }
            });
        });
        document.getElementById('clear').addEventListener('click', function() {
            disable();
            fetch("clear").then(r => r.text()).then(function(data) {
                alert(data);
                enable();
            });
        });
        document.getElementById('clearm1').addEventListener('click', function() {
            disable();
            fetch("clearm1").then(r => r.text()).then(function(data) {
                alert(data);
                enable();
            });
        });
        document.getElementById('clearm2').addEventListener('click', function() {
            disable();
            fetch("clearm2").then(r => r.text()).then(function(data) {
                alert(data);
                enable();
            });
        });
        document.getElementById('setgains').addEventListener('click', function() {
            var m1g = document.getElementById('m1gain').value;
            var m2g = document.getElementById('m2gain').value;
            fetch("m1gain", {method: 'POST', body: new URLSearchParams({gain: m1g})});
            fetch("m2gain", {method: 'POST', body: new URLSearchParams({gain: m2g})});
        });
        document.getElementById('analyze').addEventListener('click', function() {
            this.textContent = "Running...";
            running = true;
            disable();
            var file1 = document.getElementById('datafile1').value;
            var file2 = document.getElementById('datafile2').value;
            var dir = document.getElementById('datadir').textContent;
            var connect = document.getElementById('connect').checked;
            var spher = document.getElementById('spher').checked;
            var url = "analyze?connect=" + connect + "&fitsfile1=" + dir + file1 + "&fitsfile2=" + dir + file2 + "&spher=" + spher;
            fetch(url + "&format=json").then(r => r.json()).then(function(data) {
                if (continuous == false) {
                    enable();
                } else {
                    if (document.getElementById('connect').checked) {
                        activate('focuscorrect');
                        activate('comacorrect');
                        activate('m1correct');
                    }
                }
                rtimer = setTimeout(function() { running = false; }, 5000);
                document.getElementById('analyze').textContent = "Analyze";
                document.getElementById('zernikes').textContent = data;
            });
        });
        document.getElementById('latest').addEventListener('click', function() {
            fetch("files?format=json").then(r => r.json()).then(function(data) {
                if (data.length > 0) {
                    var latest_file1 = data[0];
                    var latest_file2 = data[1];
                    document.getElementById('datafile1').value = latest_file1;
                    document.getElementById('datafile2').value = latest_file2;
                    activate('analyze');
                }
            });
        });
        </script>

        <div>
            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id='image-tab' href="#images" aria-controls="images" role="tab" data-bs-toggle="tab" aria-selected="true">Input Images</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id='zern-tab' href="#zernfit" aria-controls="zernfit" role="tab" data-bs-toggle="tab" onclick="getZerns()" aria-selected="false">Wavefront Fit</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id='fringe-tab' href="#fringezerns" aria-controls="fringezerns" role="tab" data-bs-toggle="tab" aria-selected="false">Zernike Mode Amplitude</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id='bar-tab' href="#zerns" aria-controls="zerns" role="tab" data-bs-toggle="tab" aria-selected="false">RMS Wavefront Errors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id='wave-tab' href="#wavefront" aria-controls="wavefront" role="tab" data-bs-toggle="tab" aria-selected="false">Wavefront Map/PSF</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id='cell-tab' href="#cell" aria-controls="cell" role="tab" data-bs-toggle="tab" aria-selected="false">Cell Forces</a>
                </li>
            </ul>
            <div class="tab-content">
                <div role="tabpanel" class="tab-pane fade show active" id="images" aria-labelledby="image-tab">
                    <table class="table table-striped">
                        <tbody>
                            <tr>
                                <td>
                                    <div id="intra"></div>
                                </td>
                                <td>
                                    <div id="extra"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div role="tabpanel" class="tab-pane fade" id="zernfit" aria-labelledby="zern-tab">
                    <pre>
                        <div id="zernikes"></div>
                    </pre>
                </div>
                <div role="tabpanel" class="tab-pane fade" id="fringezerns" aria-labelledby="fringe-tab">
                    <table class="table table-striped">
                        <tbody>
                            <tr>
                                <td colspan="2" align="center">
                                    <div id="fringebarchart"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div role="tabpanel" class="tab-pane fade" id="zerns" aria-labelledby="bar-tab">
                    <table class="table table-striped">
                        <tbody>
                            <tr>
                                <td colspan="2" align="center">
                                    <div id="barchart"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div role="tabpanel" class="tab-pane fade" id="wavefront" aria-labelledby="wave-tab">
                    <table class="table table-striped">
                        <tbody>
                            <tr>
                                <td>
                                    <div id="wavefront"></div>
                                </td>
                                <td>
                                    <div id="psf"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div role="tabpanel" class="tab-pane fade" id="cell" aria-labelledby="cell-tab">
                    <table class="table table-striped">
                        <tbody>
                            <tr>
                                <td>
                                    <div id="forces"></div>
                                </td>
                                <td>
                                    <div id="totalforces"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <hr>
        <div class='container'>
            <pre>
                <div id="log" class="well well-lg" style="height: 300px; overflow-y: scroll"></div>
            </pre>
        </div>
    </body>
</html>

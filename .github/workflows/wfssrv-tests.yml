# GitHub Actions workflow for wfssrv testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: Python Tests

# Only build master and tags on push. Everything else is covered by the
# pull_request trigger, so branches with an open PR are not built twice.
on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

# Use the OpenAstronomy re-usable workflow that handles the dirty work of setting up
# workers and running tox.
jobs:
  test:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@v1
    with:
      envs: |
        - linux: codestyle
          pytest: false
        - linux: py313-cov
          name: py313
        - linux: py314-cov
          name: py314
        - linux: py313-numpydev
          name: py313-numpydev
          continue-on-error: true
        - linux: py313-astropydev
          name: py313-astropydev
          continue-on-error: true
        - linux: py314-numpydev
          name: py314-numpydev
          continue-on-error: true
        - linux: py314-astropydev
          name: py314-astropydev
          continue-on-error: true
        - linux: build_docs
          pytest: false
        - linux: linkcheck
          pytest: false
      coverage: 'codecov'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV }}

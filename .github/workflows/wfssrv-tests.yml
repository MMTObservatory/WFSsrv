# GitHub Actions workflow for wfssrv testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: Python Tests

# Only build master and tags on push. Everything else is covered by the
# pull_request trigger, so branches with an open PR are not built twice.
on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

# Use the OpenAstronomy re-usable workflow that handles the dirty work of setting up
# workers and running tox.
jobs:
  test:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@v3
    with:
      envs: |
        - linux: codestyle
          pytest: false
        - linux: py313
          name: py313
        # coverage comes from this job only; the code has no version-specific paths
        - linux: py314-cov
          name: py314
          coverage: 'codecov'
        - linux: py314-devdeps
          name: py314-devdeps
        - linux: py315-devdeps
          name: py315-devdeps
        - linux: build_docs
          pytest: false
        - linux: linkcheck
          pytest: false
      # codestyle, build_docs and linkcheck have no python version in their env
      # name. The runner default is older than this package supports, so pin it.
      default_python: '3.13'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV }}

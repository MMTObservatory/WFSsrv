# GitHub Actions workflow for wfssrv testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: Python Tests

# Only build master and tags on push. Everything else is covered by the
# pull_request trigger, so branches with an open PR are not built twice.
on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

jobs:

  matrix_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-ver: [13, 14]
        tox-env: [cov, astropydev, numpydev]
    steps:
    - uses: actions/checkout@v7
    - name: Set up python 3.${{ matrix.python-ver }} with tox environment ${{ matrix.tox-env }} on ${{ matrix.os }}
      uses: actions/setup-python@v7
      with:
        python-version: 3.${{ matrix.python-ver }}
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install numpy tox
    - name: Test with tox
      run: |
        tox -e py3${{ matrix.python-ver }}-${{ matrix.tox-env }}
    - name: Upload coverage to codecov
      if: matrix.tox-env == 'cov' && matrix.python-ver == '13'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV }}
        files: ./coverage.xml
        fail_ci_if_error: true

  doc_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python to build docs with sphinx
      uses: actions/setup-python@v7
      with:
        python-version: 3.13
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Build and check docs using tox
      run: |
        tox -e build_docs
        tox -e linkcheck

  codestyle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Python codestyle check
      uses: actions/setup-python@v7
      with:
        python-version: 3.13
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Check codestyle using tox
      run: |
        tox -e codestyle
